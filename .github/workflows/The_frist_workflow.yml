
name: List Repository Files

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  list-files:
    runs-on: self-hosted
    container: node:latest

    steps:
      - name: List Files
        run: |
          echo "Listing repository files:"
          ls -lah
          
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List Files
        run: |
          echo "Listing repository files:"
          ls -lah

          echo "Listing all files recursively:"
          find . -type f
