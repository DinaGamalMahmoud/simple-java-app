name: CI Java App1
on:
    push:
        branches:
          - "main"
    pull_request:
        branches:
          - "main"
    
jobs:
    build:
        name: Build and Package Java App
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Build and Packageg
              run: mvn clean package

   
