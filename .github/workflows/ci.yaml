name: ci workflow
on:
  pull_request: 
    branches: 
      -"main"


  push: 
    branches: 
      -"main"

  repository_dispatch: 
    types:
      - "build"
      
jobs:
  ci-workflow:
    name: ci workflow
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: build the app
        run: "mvn clean package"
        shell: bash

      - name: test the app
        run: "mvn test"
        shell: bash
