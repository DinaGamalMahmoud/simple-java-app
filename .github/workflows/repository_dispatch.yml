name: repository-dispatch-workflow

on:
  repository_dispatch:
    types: [build]

jobs:
  workflow-job:
    name: Run on Repository Dispatch
    runs-on: ubuntu-latest
    steps:
      - name: before checkout action
        run: ls
        shell: bash

      - name: checkout steps 
        uses: actions/checkout@v4
              
      - name: after checkout action
        run: ls
        shell: bash